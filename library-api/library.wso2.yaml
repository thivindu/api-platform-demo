version: api-platform.wso2.com/v1
kind: http/rest
data:
  name: Library API
  version: 1.0.0
  context: /library-api
  upstream:
    - url: https://api.library.com
  operations:
    - method: GET
      path: /books
    - method: POST
      path: /books
    - method: GET
      path: /books/{bookId}
    - method: GET
      path: /members
    - method: POST
      path: /members
    - method: POST
      path: /loans
    - method: POST
      path: /loans/{loanId}/return
    - method: GET
      path: /login
    - method: POST
      path: /login
