openapi: 3.0.3
info:
  title: Library API
  version: 1.0.0
  description: A very simple Library Management API for books, members, and basic loans.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: API Support
    email: support@library.com
    url: https://library.com/support
servers:
  - url: https://api.library.com
paths:
  /books:
    get:
      tags:
        - books
      summary: List books
      operationId: listBooks
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Book'
                  property2:
                    type: string
                  property3:
                    type: string
                  property4:
                    type: string
                  property5:
                    type: string
                  property6:
                    type: string
                  property7:
                    type: string
                  property8:
                    type: string
                  property9:
                    type: string
                  property10:
                    type: string
              example:
                items:
                  - id: b_123
                    title: The Pragmatic Programmer
                    author: Andrew Hunt
                    available: true
                property2: string
                property3: string
                property4: string
                property5: string
                property6: string
                property7: string
                property8: string
                property9: string
                property10: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: string
    post:
      tags:
        - books
      summary: Create book
      operationId: createBook
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookCreate'
            example:
              title: Example Title
              author: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters: []
  /books/{bookId}:
    get:
      tags:
        - books
      summary: Get book by ID
      operationId: getBook
      parameters:
        - in: path
          name: bookId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
  /members:
    get:
      tags:
        - members
      summary: List members
      operationId: listMembers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - members
      summary: Create member
      operationId: createMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /loans:
    post:
      tags:
        - loans
      summary: Borrow a book (create loan)
      operationId: createLoan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - bookId
                - memberId
              properties:
                bookId:
                  type: string
                  example: b_123
                memberId:
                  type: string
                  example: m_001
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /loans/{loanId}/return:
    post:
      tags:
        - loans
      summary: Return a book
      operationId: returnLoan
      parameters:
        - in: path
          name: loanId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loan'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
  /login:
    get:
      summary: Start login (request API key)
      description: Obtain a temporary API key for a member. Pass a member identifier as a query parameter. Returns an API key and expiry information.
      operationId: getLogin
      security: []
      parameters:
        - in: query
          name: memberId
          required: true
          description: The member's unique identifier.
          schema:
            type: string
      responses:
        '200':
          description: Login key issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
        '400':
          description: Missing or invalid memberId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: User login
      description: Authenticate a user with email and password, returning a session token on success.
      operationId: postLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  example: yourPassword123
            example:
              email: jane.doe@example.com
              password: yourPassword123
      responses:
        '200':
          description: Login successful, returns authentication token.
        '201':
          description: Response description
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookCreate'
              example:
                title: Session Token
                author: user@example.com
        '400':
          description: Invalid login payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    Book:
      type: object
      required:
        - id
        - title
        - author
        - available
      properties:
        id:
          type: string
          example: b_123
        title:
          type: string
          example: The Pragmatic Programmer
        author:
          type: string
          example: Andrew Hunt
        available:
          type: boolean
          example: true
    BookCreate:
      type: object
      required:
        - title
        - author
      properties:
        title:
          type: string
        author:
          type: string
    Member:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          example: m_001
        name:
          type: string
          example: Ada Lovelace
        email:
          type: string
          format: email
          example: ada@example.com
    MemberCreate:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        email:
          type: string
          format: email
    Loan:
      type: object
      required:
        - id
        - bookId
        - memberId
        - borrowedAt
      properties:
        id:
          type: string
          example: l_001
        bookId:
          type: string
          example: b_123
        memberId:
          type: string
          example: m_001
        borrowedAt:
          type: string
          format: date-time
          example: '2025-01-15T10:00:00.000Z'
        returnedAt:
          type: string
          format: date-time
          nullable: true
          example: null
    Error:
      type: object
      properties:
        message:
          type: string
    LoginResult:
      type: object
      description: API key issued for a member login request.
      required:
        - memberId
        - apiKey
        - issuedAt
        - expiresAt
      properties:
        memberId:
          type: string
          example: m_001
        apiKey:
          type: string
          example: key_abcdef123456
        issuedAt:
          type: string
          format: date-time
          example: '2025-11-10T10:00:00Z'
        expiresAt:
          type: string
          format: date-time
          example: '2025-11-10T11:00:00Z'
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters: {}
tags:
  - name: books
    description: Operations related to books
  - name: members
    description: Operations related to members
  - name: loans
    description: Operations related to borrowing and returning books
security:
  - ApiKeyAuth: []
