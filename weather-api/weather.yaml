openapi: 3.0.3
info:
  title: Weather API
  version: v1.0
  description: API for retrieving and updating weather information for a specific city and country.

servers:
  - url: http://sample-backend:5000/api/v2
    description: Sample backend server

paths:
  /{country_code}/{city}:
    parameters:
      - name: country_code
        in: path
        required: true
        schema:
          type: string
        description: ISO country code (e.g., "US", "LK")
      - name: city
        in: path
        required: true
        schema:
          type: string
        description: Name of the city

    get:
      summary: Get weather information
      operationId: getWeather
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  temperature:
                    type: number
                    example: 28.5
                  condition:
                    type: string
                    example: "Sunny"
                  humidity:
                    type: number
                    example: 60
        '404':
          description: City not found

    post:
      summary: Add or update weather information
      operationId: createWeather
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                temperature:
                  type: number
                condition:
                  type: string
                humidity:
                  type: number
              required:
                - temperature
                - condition
      responses:
        '201':
          description: Weather data created successfully
        '400':
          description: Invalid input

    put:
      summary: Update existing weather information
      operationId: updateWeather
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                temperature:
                  type: number
                condition:
                  type: string
                humidity:
                  type: number
              required:
                - temperature
                - condition
      responses:
        '200':
          description: Weather data updated successfully
        '404':
          description: City not found
