openapi: 3.0.3
info:
  title: PetStore API
  version: v1.0
  description: API for managing pets, store inventory, and orders.

servers:
  - url: http://petstore.swagger.io/v2
    description: PetStore backend service

paths:
  /pet/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        description: ID of the pet
        schema:
          type: integer
          format: int64
    get:
      summary: Find pet by ID
      operationId: getPetById
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: Pet not found
    delete:
      summary: Delete a pet
      operationId: deletePet
      responses:
        '200':
          description: Pet deleted successfully
        '404':
          description: Pet not found

  /pet:
    post:
      summary: Add a new pet to the store
      operationId: addPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '201':
          description: Pet created successfully
        '400':
          description: Invalid input
    put:
      summary: Update an existing pet
      operationId: updatePet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
      responses:
        '200':
          description: Pet updated successfully
        '404':
          description: Pet not found

  /store/inventory:
    get:
      summary: Returns pet inventories by status
      operationId: getInventory
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  example: 5

  /store/order:
    post:
      summary: Place an order for a pet
      operationId: placeOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '201':
          description: Order placed successfully
        '400':
          description: Invalid order

components:
  schemas:
    Pet:
      type: object
      required:
        - name
        - photoUrls
      properties:
        id:
          type: integer
          format: int64
          example: 1
        category:
          type: object
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
        name:
          type: string
          example: "doggie"
        photoUrls:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                format: int64
              name:
                type: string
        status:
          type: string
          description: Pet status in the store
          enum: [available, pending, sold]

    Order:
      type: object
      properties:
        id:
          type: integer
          format: int64
        petId:
          type: integer
          format: int64
        quantity:
          type: integer
        shipDate:
          type: string
          format: date-time
        status:
          type: string
          description: Order status
          enum: [placed, approved, delivered]
        complete:
          type: boolean
          default: false
