version: api-platform.wso2.com/v1
kind: http/rest
spec:
  name: Weather-API
  version: v1.0
  context: /weather
  upstreams:
    - url: http://sample-backend:5000/api/v2
  operations:
    - method: GET
      path: /{country_code}/{city}
    - method: POST
      path: /{country_code}/{city}
    - method: PUT
      path: /{country_code}/{city}